name: Prepare Hub preview publication
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed feature source (40 lowercase hex)
        required: true
        type: string
      preview_tag:
        description: New immutable hub-preview-N generation
        required: true
        type: string
      expected_catalog_head:
        description: Expected experience-catalog branch head, or absent for first publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'jaymsDooku/voxel-one' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
      EXPECTED_CATALOG_HEAD: ${{ inputs.expected_catalog_head }}
    steps:
      # This must run before checkout: master intentionally has no Hub tooling.
      - name: Fence controller inputs and remote state
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          source = os.environ['SOURCE_SHA']
          tag = os.environ['PREVIEW_TAG']
          expected = os.environ['EXPECTED_CATALOG_HEAD']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise ValueError('Require exact lowercase source SHA')
          match = re.fullmatch(r'hub-preview-([1-9][0-9]{0,4})', tag)
          if not match or int(match[1]) > 65535:
              raise ValueError('Require preview generation 1..65535')
          if expected != 'absent' and not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise ValueError('Require catalog SHA or absent')
          def read(path, absent=False):
              request = urllib.request.Request(
                  'https://api.github.com/repos/jaymsDooku/voxel-one/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if absent and error.code == 404:
                      return None
                  raise
          branch = read('git/ref/heads/feature/queue-62383835386364312d346130642d346262652d383736632d393534373062343337356161')
          if branch['object']['type'] != 'commit' or branch['object']['sha'] != source:
              raise ValueError('Source must equal the designated launcher branch head')
          catalog = read('git/ref/heads/experience-catalog', absent=True)
          observed = catalog['object']['sha'] if catalog else 'absent'
          if observed != expected:
              raise ValueError('Catalog compare-and-swap precondition changed')
          if read('git/ref/tags/' + tag, absent=True) is not None:
              raise ValueError('Preview tag already exists')
          if read('releases/tags/' + tag, absent=True) is not None:
              raise ValueError('Preview release already exists')
          print('Read-only source, generation and catalog fences passed')
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Fence exact source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication contract and build reviewed shell
        run: |
          python3 tools/hub/test_publisher.py
          python3 tools/hub/test_publication_bundle.py
          mvn -q '-Dtest=SandboxIdentityTest,HubCatalogTest,HubShellTest,HubShellActivationTest,UpdaterTest,AccountStoreTest,ProtocolCompatibilityTest,MultiplayerTest#authenticationRegistrationDuplicateSessionsAndCertificatePin' test package
      - name: Prepare controller-only bundle
        shell: bash
        run: |
          python3 tools/hub/publication_bundle.py prepare --native-receipt dashboard/evidence/hub-preview-native-receipt.json --web-receipt dashboard/evidence/hub-preview-web-receipt.json --jar target/voxel-one-1.0-SNAPSHOT-launcher.jar --source-sha "$SOURCE_SHA" --tag "$PREVIEW_TAG" --expected-catalog-head "$EXPECTED_CATALOG_HEAD" --output target/hub-publication
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('target/hub-publication/publication-plan.json').read_text())
          assert plan['sourceKind']=='exact-commit', 'Regenerate from committed reviewed source'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hub-publication-${{ inputs.source_sha }}
          path: target/hub-publication/
          if-no-files-found: error
          retention-days: 14
  packages:
    needs: prepare
    if: github.repository == 'jaymsDooku/voxel-one' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux}
          - {runner: windows-2022, platform: windows}
          - {runner: macos-15-intel, platform: mac-intel}
          - {runner: macos-15, platform: mac-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Fence exact source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build clean preview packages from reviewed source
        shell: bash
        run: |
          mvn -q '-Dtest=SandboxIdentityTest,HubCatalogTest,HubShellTest,HubShellActivationTest,UpdaterTest,AccountStoreTest,ProtocolCompatibilityTest,MultiplayerTest#authenticationRegistrationDuplicateSessionsAndCertificatePin' test package
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tools/hub')
          from package import package
          from publication_bundle import preview_tag
          tag=os.environ['PREVIEW_TAG']
          assert preview_tag(tag), 'Invalid preview generation'
          output=Path('target/hub-clean-preview-package')
          package(output,'0.1.'+tag.rsplit('-',1)[1],installer=os.environ['PLATFORM']=='windows',jdk=os.environ['JAVA_HOME'])
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in output.iterdir() if p.suffix in ('.zip','.msi')}
          assert files, 'No preview packages produced'
          (output/'package-scope.json').write_text(json.dumps({'sourceSha':os.environ['SOURCE_SHA'],'platform':os.environ['PLATFORM'],'previewTag':tag,'filesSha256':files,'fixtureGeneration':False,'stableRolloutQualified':False,'scope':'Clean source package, not a fixture generation. Packaging success alone does not satisfy native gameplay, physical DPI or published upgrade qualification.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hub-preview-package-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: |
            target/hub-clean-preview-package/*.zip
            target/hub-clean-preview-package/*.msi
            target/hub-clean-preview-package/package-scope.json
          if-no-files-found: error
          retention-days: 14
