name: iOS simulator checks
run-name: 'Voxel iOS ${{ inputs.requestId || github.sha }}'
on:
  workflow_dispatch:
    inputs:
      expectedHead:
        description: Exact 40-character lowercase source commit SHA
        required: true
        type: string
      mode:
        description: Simulator readiness or actual native client validation
        required: true
        default: preflight
        type: choice
        options: [preflight, client]
      requestId:
        description: Unique canonical UUID generated by the requesting controller
        required: true
        type: string
  push:
    branches: [feature/ios-worker-bootstrap]
  pull_request:
    paths:
      - .github/workflows/ios-simulator.yml
      - tools/ios/**
      - ios/check-simulator.sh
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Validate requested checkout identity
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_HEAD: ${{ inputs.expectedHead }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_ID: ${{ inputs.requestId }}
        run: |
          python3 - <<'PY'
          import os, re, uuid
          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          head = os.environ['REQUESTED_HEAD'] if manual else os.environ['EVENT_HEAD']
          mode = os.environ['REQUESTED_MODE'] if manual else 'preflight'
          request_id = os.environ['REQUESTED_ID'] if manual else str(uuid.uuid4())
          if not re.fullmatch(r'[0-9a-f]{40}', head) or mode not in ('preflight', 'client'):
              raise SystemExit('Invalid exact-head request')
          try:
              if str(uuid.UUID(request_id)) != request_id:
                  raise ValueError()
          except ValueError:
              raise SystemExit('Invalid request UUID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'head={head}\nmode={mode}\nrequestId={request_id}\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout and tooling contracts
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tools/ios -p 'test_*.py' -v
      - name: Boot fresh iPhone and collect evidence
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.head }}
          IOS_CHECK_MODE: ${{ steps.request.outputs.mode }}
          IOS_REQUEST_ID: ${{ steps.request.outputs.requestId }}
        run: |
          python3 tools/ios/simulator_checks.py --expected-head "$EXPECTED_HEAD" --mode "$IOS_CHECK_MODE" --request-id "$IOS_REQUEST_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-evidence
          path: |
            ios-evidence/report.json
            ios-evidence/preflight.png
            ios-evidence/client.png
            ios-evidence/*.mp4
          if-no-files-found: warn
          retention-days: 7
